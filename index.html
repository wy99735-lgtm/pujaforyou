<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Puja 💙🥀</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500;1,700&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
:root{--cream:#fff0f4;--rose:#ff5d8f;--gold:#f6d7a7;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#08020a}
body{background:radial-gradient(120% 90% at 50% 58%,#40102f 0%,#1d0819 42%,#08020a 100%);font-family:'Cormorant Garamond',Georgia,serif;color:var(--cream)}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 42%,rgba(4,1,6,.8) 100%)}
#flash{position:fixed;inset:0;background:#ffd6e6;opacity:0;pointer-events:none}

/* premium enter */
#enter{position:fixed;left:50%;top:50%;width:132px;height:132px;margin:-66px 0 0 -66px;border:0;border-radius:50%;background:none;cursor:pointer;outline:none;display:grid;place-items:center;animation:glow 3.4s ease-in-out infinite;transition:transform .8s cubic-bezier(.2,.8,.2,1),opacity .8s}
#enter::before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,#ff5d8f,#f6d7a7,#ff9fbd,#8e1450,#f6d7a7,#ff5d8f);animation:spin 6s linear infinite}
#enter::after{content:"";position:absolute;inset:2px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#4a1535,#1a0616 75%)}
#enter span{position:relative;z-index:2;font-style:italic;font-weight:700;font-size:1.7rem;letter-spacing:.08em;background:linear-gradient(120deg,#fff0f4 20%,#f6d7a7 50%,#ffb3cb 80%);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(0 0 10px rgba(255,150,190,.6))}
#enter:focus-visible{box-shadow:0 0 0 3px rgba(246,215,167,.8)}
#enter.go{transform:scale(.15);opacity:0;pointer-events:none;animation:none}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes glow{0%,100%{transform:scale(1);box-shadow:0 0 34px rgba(255,93,143,.35),0 0 90px rgba(255,93,143,.12)}50%{transform:scale(1.08);box-shadow:0 0 60px rgba(255,93,143,.65),0 0 130px rgba(246,215,167,.2)}}

/* text */
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px 26px 90px;text-align:center;pointer-events:none}
#line{position:relative;z-index:1;max-width:21em;transition:opacity .9s ease,filter .9s ease,transform .9s ease}
#stage::before{content:"";position:absolute;left:50%;top:50%;width:min(140vw,950px);height:min(78vh,560px);transform:translate(-50%,-56%);background:radial-gradient(ellipse at center,rgba(10,2,12,.85) 0%,rgba(10,2,12,.55) 48%,transparent 74%);opacity:0;transition:opacity 2s ease}
#stage.on::before{opacity:1}
#line.out{opacity:0;filter:blur(12px);transform:translateY(-10px) scale(.98)}
#line.name{font-family:'Great Vibes','Cormorant Garamond',cursive;font-size:clamp(4.4rem,23vw,9rem);line-height:1.1;color:#fff;max-width:none}
#line.txt{font-size:clamp(1.55rem,6.8vw,2.7rem);font-weight:500;font-style:italic;line-height:1.5;color:var(--cream)}
#line .w{display:inline-block;white-space:pre;opacity:0;filter:blur(12px);transform:translateY(12px);animation:wr 1.1s cubic-bezier(.2,.7,.2,1) forwards;text-shadow:0 0 22px rgba(255,93,143,.5),0 2px 4px rgba(8,2,10,.9),0 2px 18px rgba(8,2,10,.95)}
@keyframes wr{to{opacity:1;filter:blur(0);transform:none}}
#foot{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 28px);text-align:center;font-style:italic;font-weight:700;font-size:clamp(1rem,4.2vw,1.35rem);letter-spacing:.32em;color:var(--gold);opacity:0;transition:opacity 2s ease;text-shadow:0 0 18px rgba(246,215,167,.5),0 2px 12px rgba(8,2,10,.95);pointer-events:none}
#foot.show{opacity:.95}
@media (prefers-reduced-motion:reduce){#enter,#enter::before{animation:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="vig"></div>
<div id="flash"></div>
<button id="enter" aria-label="Enter"><span>Enter</span></button>
<div id="stage"><div id="line"></div></div>
<div id="foot">PUJA FOR YOU 💙🥀</div>

<script>
(function(){
var cv=document.getElementById('c'),ctx=cv.getContext('2d');
var btn=document.getElementById('enter'),flash=document.getElementById('flash'),lineEl=document.getElementById('line'),foot=document.getElementById('foot');
var W=0,H=0,dpr=1;
function resize(){dpr=Math.min(window.devicePixelRatio||1,2);W=window.innerWidth;H=window.innerHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
resize();window.addEventListener('resize',resize);

var LINES=[
 {t:'Puja 💙🥀',c:'name',d:3000},
 {t:'tomar sathe kotha bolte gele keno jani nervous hoye jai. 🙈',c:'txt'},
 {t:'Ekta kotha boli? Tomake na, amar onek bhalo legeche. 😻❤️',c:'txt'},
 {t:'Tumi ki amake tomar moner moto kore janar ekta chance dibe? 🥹💗',c:'txt'},
 {t:'Ar bolo toh, tumi ki amar special manush hobe? 🫶🏻❤️‍🩹',c:'txt',d:6200},
 {t:'Love you 🫶🏻',c:'name',last:true}
];

var sparks=[];for(var i=0;i<70;i++)sparks.push({x:Math.random(),y:Math.random(),r:Math.random()*1.3+.3,p:Math.random()*6.28,s:Math.random()*1.3+.4});
var bokeh=[];for(var b=0;b<22;b++)bokeh.push({x:Math.random(),y:Math.random(),r:Math.random()*34+14,vy:Math.random()*.012+.004,p:Math.random()*6.28,c:Math.random()<.5?'255,93,143':'246,215,167'});

var EM=['💙','🥀','❤️‍🩹','❤️‍🔥','✨','🌟','🖤','🩵','💘','🩷','🤍','🫣','🤩','🥰','😍','😘'];
var sprites=EM.map(function(e){var o=document.createElement('canvas');o.width=o.height=96;var x=o.getContext('2d');x.font='72px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText(e,48,52);return o});

function heart(c,s){c.beginPath();c.moveTo(0,s*.9);c.bezierCurveTo(-s*1.35,-s*.1,-s*.75,-s*1.1,0,-s*.4);c.bezierCurveTo(s*.75,-s*1.1,s*1.35,-s*.1,0,s*.9);c.closePath()}

var phase='idle',t0=0,parts=[],drops=[],rings=[],spawnAcc=0,raining=false;
var COLORS=['#ff5d8f','#ff8fb1','#ffb3cb','#f6d7a7','#ffffff','#ff3d76'];

function burst(cx,cy){
  for(var i=0;i<150;i++){
    var a=Math.random()*6.283,sp=Math.random()*600+120;
    parts.push({x:cx,y:cy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-90,life:0,max:Math.random()*1.5+1.2,s:Math.random()*10+3,h:Math.random()<.5,c:COLORS[(Math.random()*COLORS.length)|0],rot:Math.random()*6.28,vr:(Math.random()-.5)*8});
  }
  rings.push({x:cx,y:cy,r:10,a:1},{x:cx,y:cy,r:-60,a:1});
  flash.style.transition='none';flash.style.opacity='.8';
  requestAnimationFrame(function(){requestAnimationFrame(function(){flash.style.transition='opacity 1.2s ease-out';flash.style.opacity='0'})});
  try{navigator.vibrate&&navigator.vibrate([40,60,120])}catch(e){}
}

function beatScale(t){
  var grow=.75+Math.min(t/2.6,1)*.5;
  var p=(t%.86)/.86;
  var b=Math.exp(-Math.pow((p-.08)/.07,2))*.22+Math.exp(-Math.pow((p-.30)/.08,2))*.15;
  return grow*(1+b);
}

/* line sequencer */
function render(l){
  lineEl.className=l.c;lineEl.innerHTML='';
  var words=l.t.split(' '),h='';
  for(var i=0;i<words.length;i++){h+='<span class="w" style="animation-delay:'+(i*.11).toFixed(2)+'s">'+words[i]+(i<words.length-1?' ':'')+'</span>'}
  lineEl.innerHTML=h;
}
function play(i){
  var l=LINES[i];render(l);
  if(l.last)return;
  var dur=l.d||(3200+l.t.length*55);
  setTimeout(function(){lineEl.classList.add('out');setTimeout(function(){play(i+1)},1000)},dur);
}

var last=0;
function frame(ts){
  if(!last)last=ts;var dt=Math.min((ts-last)/1000,.05);last=ts;
  ctx.clearRect(0,0,W,H);
  var now=ts/1000,cx=W/2,cy=H/2;

  /* bokeh */
  ctx.globalCompositeOperation='lighter';
  for(var q=0;q<bokeh.length;q++){var k=bokeh[q];k.y-=k.vy*dt;if(k.y<-.1)k.y=1.1;
    var px=k.x*W+Math.sin(now*.3+k.p)*20,py=k.y*H;
    var g0=ctx.createRadialGradient(px,py,0,px,py,k.r);g0.addColorStop(0,'rgba('+k.c+',.16)');g0.addColorStop(1,'rgba('+k.c+',0)');
    ctx.fillStyle=g0;ctx.beginPath();ctx.arc(px,py,k.r,0,6.283);ctx.fill()}
  ctx.globalCompositeOperation='source-over';
  /* sparkles */
  for(var i=0;i<sparks.length;i++){var s=sparks[i];ctx.globalAlpha=.2+.6*(.5+.5*Math.sin(now*s.s+s.p));ctx.fillStyle='#ffdce8';ctx.beginPath();ctx.arc(s.x*W,s.y*H,s.r,0,6.283);ctx.fill()}
  ctx.globalAlpha=1;

  /* big beating heart */
  if(phase==='heart'){
    var t=(ts-t0)/1000;
    var sc=beatScale(t),base=Math.min(W,H)*.26;
    var shake=t>1.9?(t-1.9)*6:0;
    ctx.save();
    ctx.translate(cx+(Math.random()-.5)*shake,cy+(Math.random()-.5)*shake);
    ctx.globalAlpha=Math.min(t/.5,1);
    ctx.shadowColor='rgba(255,93,143,.9)';ctx.shadowBlur=50+t*30;
    var g=ctx.createRadialGradient(-base*.3*sc,-base*.4*sc,base*.1,0,0,base*sc*1.3);
    g.addColorStop(0,'#ffb3cb');g.addColorStop(.5,'#ff3d76');g.addColorStop(1,'#7d1048');
    ctx.fillStyle=g;heart(ctx,base*sc);ctx.fill();
    ctx.restore();
    if(t>=2.7){phase='burst';burst(cx,cy);
      setTimeout(function(){raining=true},800);
      setTimeout(function(){document.getElementById('stage').classList.add('on');play(0)},1100);
      setTimeout(function(){foot.classList.add('show')},2200);}
  }

  /* rings */
  for(var r=rings.length-1;r>=0;r--){var o=rings[r];o.r+=dt*Math.max(W,H)*1.1;o.a-=dt*1.1;
    if(o.a<=0){rings.splice(r,1);continue}
    if(o.r>0){ctx.globalAlpha=o.a*.6;ctx.strokeStyle='#ffc2d4';ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(o.x,o.y,o.r,0,6.283);ctx.stroke()}}
  ctx.globalAlpha=1;

  /* particles */
  ctx.globalCompositeOperation='lighter';
  for(var j=parts.length-1;j>=0;j--){
    var p=parts[j];p.life+=dt;if(p.life>=p.max){parts.splice(j,1);continue}
    p.vx*=.985;p.vy=p.vy*.985+240*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt;
    var f=1-p.life/p.max;ctx.globalAlpha=f*.9;ctx.fillStyle=p.c;
    if(p.h){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);heart(ctx,p.s*f+1);ctx.fill();ctx.restore()}
    else{ctx.beginPath();ctx.arc(p.x,p.y,p.s*.35*f+.6,0,6.283);ctx.fill()}
  }
  ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;

  /* emoji rain */
  if(raining){
    spawnAcc+=dt;
    while(spawnAcc>.09&&drops.length<110){spawnAcc-=.09;
      drops.push({x:Math.random()*W,y:-50,vy:(Math.random()*.12+.09)*H,sw:Math.random()*30+10,sp:Math.random()*2+1,ph:Math.random()*6.28,s:Math.random()*26+22,im:sprites[(Math.random()*sprites.length)|0],rot:(Math.random()-.5)*.8,vr:(Math.random()-.5)*1.2,a:Math.random()*.18+.18});
    }
    if(spawnAcc>.5)spawnAcc=0;
  }
  for(var d=drops.length-1;d>=0;d--){
    var m=drops[d];m.y+=m.vy*dt;m.rot+=m.vr*dt;
    if(m.y>H+60){drops.splice(d,1);continue}
    ctx.globalAlpha=m.a;ctx.save();ctx.translate(m.x+Math.sin(now*m.sp+m.ph)*m.sw,m.y);ctx.rotate(m.rot);ctx.drawImage(m.im,-m.s/2,-m.s/2,m.s,m.s);ctx.restore();
  }
  ctx.globalAlpha=1;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

btn.addEventListener('click',function(){
  if(phase!=='idle')return;
  phase='wait';btn.classList.add('go');
  setTimeout(function(){phase='heart';t0=performance.now()},500);
});
})();
</script>
</body>
</html>
